    <!-- Vendor JS Files - Defer Loading -->
    <script>
      // Preloader removal script
      window.addEventListener("load", function () {
        setTimeout(function () {
          const preloader = document.getElementById("preloader");
          if (preloader) {
            preloader.style.opacity = "0";
            preloader.style.visibility = "hidden";
            setTimeout(() => preloader.remove(), 500);
          }
          document.body.classList.add("loaded");
        }, 500);
      });

      // Load non-critical scripts after page load
      function loadScript(src, callback) {
        const script = document.createElement("script");
        script.src = src;
        script.async = true;
        script.defer = true;
        if (callback) script.onload = callback;
        document.body.appendChild(script);
      }

      // Load scripts after DOM is ready
      document.addEventListener("DOMContentLoaded", function () {
        // Load Bootstrap
        loadScript(
          "https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js",
        );

        // Load AOS after a delay
        setTimeout(() => {
          loadScript(
            "https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js",
            function () {
              if (typeof AOS !== "undefined")
                AOS.init({ duration: 800, once: true });
            },
          );
        }, 1000);

        // Load other libraries
        loadScript(
          "https://cdn.jsdelivr.net/npm/glightbox@3.2.0/dist/js/glightbox.min.js",
        );
        loadScript(
          "https://cdnjs.cloudflare.com/ajax/libs/isotope-layout/3.0.6/isotope.pkgd.min.js",
        );
      });
    </script>
